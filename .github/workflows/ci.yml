name: QuickBiz CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mobile-checks:
    name: Mobile App Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: ESLint Lint Check
        run: npm run lint

      - name: Run Parser Scenario Tests
        run: npx ts-node utils/test-parser-scenarios.ts

  server-checks:
    name: Express Server Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Start Server in background
        run: |
          npm run build
          node dist/server.js &
          echo "Waiting for server to spin up..."
          sleep 5
        env:
          JWT_SECRET: ci_jwt_secret_key_2026_test_env
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/quickbiz_test

      - name: Run API Integration Tests
        run: npx ts-node src/test-api.ts
        env:
          JWT_SECRET: ci_jwt_secret_key_2026_test_env

      - name: Run API Security Tests
        run: npx ts-node src/security-test.ts
        env:
          JWT_SECRET: ci_jwt_secret_key_2026_test_env
